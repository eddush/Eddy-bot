<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EddyBot Admin</title><style>:root{--bg:#070b14;--card:#11182a;--line:#26314a;--text:#f4f7ff;--muted:#91a0bd;--p:#806cff;--c:#22d3ee;--ok:#34d399;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#1a1740,transparent 35%),radial-gradient(circle at 90% 90%,#063443,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;padding:24px}main{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.logo{display:flex;gap:12px;align-items:center}.mark{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--p),var(--c))}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:rgba(17,24,42,.82);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(18px)}.wide{grid-column:1/-1}h1,h2{margin:0 0 7px}h1{font-size:28px}h2{font-size:18px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:center;margin-top:10px}.row.command{grid-template-columns:minmax(100px,1fr) 110px minmax(170px,1fr) auto}.input,.select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0a101c;color:var(--text);outline:none;min-width:0}.btn{border:1px solid var(--line);background:#182238;color:#fff;padding:10px 13px;border-radius:12px;cursor:pointer;white-space:nowrap}.btn:hover{filter:brightness(1.15)}.primary{background:linear-gradient(135deg,var(--p),#5f52df);border:0}.danger{color:#fecdd3}.status{margin-top:12px;min-height:20px;font-size:13px}.role-id{direction:ltr;text-align:left;font-family:monospace}.toggle{display:flex;align-items:center;gap:7px;white-space:nowrap}.role-name{overflow:hidden;text-overflow:ellipsis}.empty{color:var(--muted);padding:18px 0;text-align:center}.note{padding:11px;border:1px solid rgba(34,211,238,.2);background:rgba(34,211,238,.05);border-radius:12px;margin-top:13px;color:#b9c8e2;font-size:13px;line-height:1.5}@media(max-width:800px){body{padding:13px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.row,.row.command{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.btn{min-height:42px}.card{border-radius:18px;padding:15px}}
</style></head><body><main><header class="top"><div class="logo"><div class="mark">E</div><div><h1>EddyBot Admin</h1><div class="muted">ניהול הרשאות, רולים ופקודות</div></div></div><button class="btn" onclick="load()">רענון</button></header><div class="grid"><section class="card wide"><h2>רולים</h2><div class="muted">שינוי ID של Role קיים או יצירת Role חדש בשרת.</div><div id="roles"><div class="empty">טוען...</div></div><div class="row"><input id="newKey" class="input" placeholder="שם פנימי, למשל support"><input id="newName" class="input" placeholder="שם הרול בדיסקורד"><button class="btn primary" onclick="createRole()">יצירת רול</button></div><div class="note">כדי ליצור רול, לבוט חייבת להיות הרשאת Manage Roles. שינוי ID רק שומר את ה־ID החדש בהגדרות הפאנל.</div><div id="roleStatus" class="status"></div></section><section class="card wide"><h2>הרשאות פקודות</h2><div class="muted">אפשר להפעיל/להשבית פקודה ולהגדיר Role שנדרש כדי להשתמש בה.</div><div id="commands"><div class="empty">טוען...</div></div><div id="cmdStatus" class="status"></div></section></div></main><script>let pass=sessionStorage.getItem('panelPass')||'';function headers(){return {'Content-Type':'application/json','x-panel-password':pass}}async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-panel-password':pass};const r=await fetch(url,opt);if(r.status===401){pass=prompt('סיסמת הפאנל');sessionStorage.setItem('panelPass',pass||'');return api(url,opt)}const d=await r.json();if(!r.ok)throw Error(d.error||'שגיאה');return d}async function load(){try{const d=await api('/api/panel/admin');renderRoles(d.roles||[]);renderCommands(d.commands||[])}catch(e){document.body.innerHTML='<main><section class="card"><h2>אין גישה</h2><p class="muted">'+esc(e.message)+'</p></section></main>'}}function renderRoles(a){document.getElementById('roles').innerHTML=a.map(r=>`<div class="row"><div class="role-name"><b>${esc(r.name)}</b><div class="muted">${esc(r.key)} · ${r.exists?'נמצא בשרת':'לא נמצא בשרת'}</div></div><input id="role-${esc(r.key)}" class="input role-id" value="${esc(r.id)}"><button class="btn primary" onclick="saveRole('${esc(r.key)}')">שמירה</button></div>`).join('')||'<div class="empty">אין רולים</div>'}function renderCommands(a){document.getElementById('commands').innerHTML=a.map(c=>`<div class="row command"><div><b>/${esc(c.name)}</b><div class="muted">${esc(c.description)}</div></div><label class="toggle"><input id="en-${esc(c.name)}" type="checkbox" ${c.enabled?'checked':''}> פעיל</label><input id="cmd-${esc(c.name)}" class="input role-id" placeholder="Role ID (ריק = כולם)" value="${esc(c.roleId||'')}"><button class="btn primary" onclick="saveCommand('${esc(c.name)}')">שמירה</button></div>`).join('')||'<div class="empty">אין פקודות</div>'}async function saveRole(key){try{const id=document.getElementById('role-'+key).value.trim();await api('/api/panel/admin/role',{method:'POST',headers:headers(),body:JSON.stringify({key,id})});document.getElementById('roleStatus').textContent='הרול נשמר';load()}catch(e){document.getElementById('roleStatus').textContent=e.message}}async function createRole(){try{const key=document.getElementById('newKey').value.trim(),name=document.getElementById('newName').value.trim();if(!key||!name)throw Error('צריך למלא שם פנימי ושם רול');const d=await api('/api/panel/admin/role/create',{method:'POST',headers:headers(),body:JSON.stringify({key,name})});document.getElementById('roleStatus').textContent='הרול נוצר: '+d.role.id;load()}catch(e){document.getElementById('roleStatus').textContent=e.message}}async function saveCommand(name){try{const enabled=document.getElementById('en-'+name).checked,roleId=document.getElementById('cmd-'+name).value.trim();await api('/api/panel/admin/command',{method:'POST',headers:headers(),body:JSON.stringify({name,enabled,roleId:roleId||null})});document.getElementById('cmdStatus').textContent='ההרשאה נשמרה';}catch(e){document.getElementById('cmdStatus').textContent=e.message}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
